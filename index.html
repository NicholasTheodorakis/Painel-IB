<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Painel da Preparação IB</title><link rel="apple-touch-icon" href="icone.png"><meta name="apple-mobile-web-app-title" content="Painel IB"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Painel da Preparação IB</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: daily command panel — sticky green top bar with view tabs; "Hoje" is a two-column day sheet (checklist left, context right); other views are full-width. */
:root{
  --bg:#f1f7f2; --paper:#ffffff; --paper2:#f7fbf8; --ink:#14301f; --muted:#5b7264; --line:#d6e6da;
  --forest:#0f5132; --green:#1f8a4c; --emerald:#18a058; --mint:#dff3e6; --mint2:#eef8f1; --lime:#8fbf2f; --lime-s:#f1f7df;
  --teal:#0f8b7d; --teal-s:#e2f4f1; --olive:#6b7f1a; --olive-s:#eef2dc; --sage:#4f6b5c; --sage-s:#e9efeb;
  --amber:#b7791f; --amber-s:#fbf1dd; --red:#b42318; --red-s:#fdecea; --gold:#b8901f; --gold-s:#faf3d9;
  --tec:#1f8a4c; --tec-s:#e3f4e9; --vag:#0f8b7d; --vag-s:#e2f4f1; --ia:#6b8e23; --ia-s:#eef4dd; --ent:#b7791f; --ent-s:#fbf1dd; --sis:#4f6b5c; --sis-s:#e9efeb;
  --on:#ffffff; --h1:#cfeedb; --h2:#8fd8ac;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Figtree","Segoe UI",Arial,sans-serif; --mono:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1712; --paper:#13211a; --paper2:#172a20; --ink:#e3f1e8; --muted:#9cb5a6; --line:#25392e;
  --forest:#7fd6a4; --green:#4cc07f; --emerald:#3fd283; --mint:#183a27; --mint2:#15291e; --lime:#a9d457; --lime-s:#26301a;
  --teal:#45c4b4; --teal-s:#123330; --olive:#a9c25a; --olive-s:#262e16; --sage:#9fb8aa; --sage-s:#1d2a23;
  --amber:#e7ae55; --amber-s:#33270f; --red:#f2877c; --red-s:#3a1916; --gold:#e0bf5a; --gold-s:#332a10;
  --tec:#4cc07f; --tec-s:#183a27; --vag:#45c4b4; --vag-s:#123330; --ia:#a9c25a; --ia-s:#262e16; --ent:#e7ae55; --ent-s:#33270f; --sis:#9fb8aa; --sis-s:#1d2a23; --on:#0d1712; --h1:#1f4a31; --h2:#2f7a4f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1712; --paper:#13211a; --paper2:#172a20; --ink:#e3f1e8; --muted:#9cb5a6; --line:#25392e;
  --forest:#7fd6a4; --green:#4cc07f; --emerald:#3fd283; --mint:#183a27; --mint2:#15291e; --lime:#a9d457; --lime-s:#26301a;
  --teal:#45c4b4; --teal-s:#123330; --olive:#a9c25a; --olive-s:#262e16; --sage:#9fb8aa; --sage-s:#1d2a23;
  --amber:#e7ae55; --amber-s:#33270f; --red:#f2877c; --red-s:#3a1916; --gold:#e0bf5a; --gold-s:#332a10;
  --tec:#4cc07f; --tec-s:#183a27; --vag:#45c4b4; --vag-s:#123330; --ia:#a9c25a; --ia-s:#262e16; --ent:#e7ae55; --ent-s:#33270f; --sis:#9fb8aa; --sis-s:#1d2a23; --on:#0d1712; --h1:#1f4a31; --h2:#2f7a4f; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--forest)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--forest);color:var(--on)}
.top-in{max-width:1280px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:-.01em}
.brand .meta{font:500 12px var(--mono);opacity:.85;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--lime);display:inline-block}
.sync.local i{background:var(--gold)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:inherit;opacity:.78;padding:9px 13px;border-radius:8px 8px 0 0;font-weight:600;font-size:14px;white-space:nowrap}
.tab[aria-current="page"]{background:var(--bg);color:var(--forest);opacity:1}
main{max-width:1280px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-.01em;color:var(--forest);text-wrap:balance}
h3{font-family:var(--display);font-size:18px;margin:0 0 8px;color:var(--forest)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--paper);border:1px solid var(--line);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on)}
.btn.ghost{background:transparent}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--mint);color:var(--forest)}
.chip.prova{background:var(--red-s);color:var(--red)} .chip.mensal{background:var(--red);color:var(--on)} .chip.pratica{background:var(--teal-s);color:var(--teal)}
.chip.cons{background:var(--olive-s);color:var(--olive)} .chip.free{background:var(--sage-s);color:var(--sage)} .chip.mile{background:var(--gold-s);color:var(--gold)}
.bar{height:8px;background:var(--mint2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--emerald));border-radius:99px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
/* HOJE */
.dayhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.dayhead .kick{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dnav{display:flex;gap:6px;align-items:center}
.theme{background:linear-gradient(135deg,var(--mint) 0%,var(--paper) 70%);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.theme .t{font-family:var(--display);font-size:22px;color:var(--forest);margin:4px 0 6px;line-height:1.2}
.theme ul{margin:6px 0 0;padding-left:18px} .theme li{margin:2px 0}
.ring{--p:0;width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--emerald) calc(var(--p)*1%),var(--mint2) 0);display:grid;place-items:center;flex:none}
.ring b{background:var(--paper);width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--forest)}
.group{border:1px solid var(--line);background:var(--paper);border-radius:12px;margin-bottom:10px;overflow:hidden}
.group.now{border-color:var(--emerald);box-shadow:0 0 0 3px var(--mint)}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;background:var(--paper2);border-bottom:1px solid var(--line)}
.gh b{font-size:14px} .gh .mono{color:var(--muted)}
.nowtag{font-size:11px;font-weight:700;color:var(--on);background:var(--emerald);padding:1px 8px;border-radius:99px}
.items{list-style:none;margin:0;padding:6px 8px}
.it{display:flex;gap:10px;align-items:flex-start;padding:7px 6px;border-radius:8px}
.it:hover{background:var(--mint2)}
.it input[type=checkbox]{appearance:none;width:20px;height:20px;border:2px solid var(--green);border-radius:6px;flex:none;margin-top:1px;display:grid;place-items:center;background:var(--paper)}
.it input[type=checkbox]:checked{background:var(--green)}
.it input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--on);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it label{flex:1;min-width:0;cursor:pointer}
.it .lb{font-weight:500}
.it .sb{display:block;font-size:13px;color:var(--muted)}
.it.done .lb{text-decoration:line-through;text-decoration-color:var(--green);color:var(--muted)}
.lane-dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:8px}
.side .card{margin-bottom:14px}
.alert{border-left:4px solid var(--amber);background:var(--amber-s);border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:14px}
.alert.red{border-color:var(--red);background:var(--red-s)} .alert.gold{border-color:var(--gold);background:var(--gold-s)} .alert.green{border-color:var(--green);background:var(--mint)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.scale{display:flex;gap:6px} .scale button{flex:1;border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:6px 0;font-weight:600}
.scale button[aria-pressed="true"]{background:var(--green);color:var(--on);border-color:var(--green)}
.upc{list-style:none;margin:0;padding:0} .upc li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px} .upc li:last-child{border:0}
.upc .mono{min-width:58px;color:var(--muted)}
/* SEMANA */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.wk{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.wk{grid-template-columns:1fr}}
.wd{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.wd.today{border-color:var(--emerald);box-shadow:0 0 0 3px var(--mint)}
.wd.we{background:var(--paper2)}
.wd .d{font:500 12px var(--mono);color:var(--muted)} .wd .tt{font-weight:600;font-size:14px;line-height:1.3}
/* CALENDÁRIO */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.toolbar select{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.wblock{margin-bottom:18px}
.wblock>h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.day{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
details.day[open]{border-color:var(--green)}
details.day>summary{list-style:none;display:grid;grid-template-columns:96px minmax(0,1fr) 120px;gap:12px;align-items:center;padding:9px 12px;cursor:pointer}
details.day>summary::-webkit-details-marker{display:none}
details.day.is-today>summary{background:var(--mint)}
details.day .sum-t{font-weight:600;min-width:0;overflow-wrap:anywhere}
details.day .body{padding:4px 12px 12px;border-top:1px solid var(--line)}
@media (max-width:600px){details.day>summary{grid-template-columns:76px minmax(0,1fr)} details.day>summary .bar{display:none}}
/* PROGRESSO */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-family:var(--display);font-size:30px;color:var(--forest);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.heatwrap{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-template-rows:16px repeat(7,20px);grid-auto-flow:column;grid-auto-columns:20px;gap:4px;font-size:11px;width:max-content}
.heat .c{width:20px;height:20px;border-radius:4px;background:var(--mint2);border:1px solid var(--line)}
.heat .wl{white-space:nowrap;overflow:visible}
.heat .c.l1{background:var(--h1)} .heat .c.l2{background:var(--h2)} .heat .c.l3{background:var(--emerald)} .heat .c.fut{background:transparent;border-style:dashed}
.heat .c.today{outline:2px solid var(--forest)}
.heat .wl{font:500 10.5px var(--mono);color:var(--muted);align-self:center}
.mods .m{display:grid;grid-template-columns:minmax(0,1fr) 140px 46px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.chartwrap{overflow-x:auto}
/* TÓPICOS */
.tmod{margin-bottom:14px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--line)}
.lv{display:flex;gap:3px}
.lv button{width:30px;height:28px;border:1px solid var(--line);background:var(--paper2);border-radius:6px;font:600 12px var(--mono)}
.lv button[aria-pressed="true"]{background:var(--green);color:var(--on);border-color:var(--green)}
/* FLUXO */
.spine{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px 0}
.sp{position:relative;background:var(--paper);border:1px solid var(--line);padding:10px 14px;margin-right:22px;flex:1 1 140px;border-radius:10px;min-width:0}
.sp:not(:last-child)::after{content:"→";position:absolute;right:-18px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.sp b{display:block;font-size:14px} .sp span{font:500 11.5px var(--mono);color:var(--muted)}
.sp.done{border-color:var(--green);background:var(--mint)} .sp.goal{background:var(--forest);border-color:var(--forest)} .sp.goal b,.sp.goal span{color:var(--on)}
.lanehead,.phase{display:grid;grid-template-columns:140px repeat(5,minmax(0,1fr));gap:10px}
.lanehead{margin-top:14px}
.lh{border-top:4px solid var(--c);background:var(--paper);padding:8px 10px;border-radius:8px} .lh b{display:block;color:var(--c);font-size:13.5px} .lh span{font-size:11.5px;color:var(--muted)}
.l-tec{--c:var(--tec);--s:var(--tec-s)} .l-vag{--c:var(--vag);--s:var(--vag-s)} .l-ia{--c:var(--ia);--s:var(--ia-s)} .l-ent{--c:var(--ent);--s:var(--ent-s)} .l-sis{--c:var(--sis);--s:var(--sis-s)}
.phase{margin-top:10px}
.pl{background:var(--forest);color:var(--on);padding:12px;border-radius:8px;display:flex;flex-direction:column;gap:3px}
.pl .pc{font:500 12px var(--mono);opacity:.75} .pl b{font-family:var(--display);font-size:17px;line-height:1.15} .pl .pd{font:500 12px var(--mono);opacity:.9}
.cell{background:var(--s);border-radius:8px;padding:10px;min-width:0}
.cl{display:none;font-weight:700;color:var(--c);font-size:12.5px;margin-bottom:6px}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.n{position:relative;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:7px 9px}
.n:not(:last-child)::after{content:"";position:absolute;left:50%;bottom:-15px;width:2px;height:13px;background:var(--c);opacity:.55}
.nh{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.nh .mono{font-size:11px;color:var(--muted)}
.badge{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px}
.n .tt{margin:3px 0 0;font-weight:600;font-size:13px;line-height:1.3} .n .det{margin:3px 0 0;font-size:12px;color:var(--muted)} .n .out{margin-top:5px;font-size:11.5px;color:var(--c);font-weight:600}
.k-done{border-left-color:var(--green)} .k-done .badge{background:var(--mint);color:var(--forest)}
.k-test .badge{background:var(--red-s);color:var(--red)}
.k-gate{border:1.5px dashed var(--red);border-left:3px solid var(--red)} .k-gate .badge{background:var(--red);color:var(--on)}
.k-mile{background:var(--gold-s);border-left-color:var(--gold)} .k-mile .badge{background:var(--gold);color:var(--on)}
.k-loop{border-style:dotted;border-left-style:solid} .k-wait{opacity:.7}
.loops{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.loop{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.loop header{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px} .loop header b{display:block} .loop header span{font-size:12px;color:var(--muted)}
.ln{font:600 13px var(--mono);background:var(--forest);color:var(--on);width:26px;height:26px;display:grid;place-items:center;border-radius:50%;flex:none}
.lc{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 0;align-items:center}
.lc li{font-size:12.5px;background:var(--mint2);border:1px solid var(--line);padding:3px 8px;border-radius:6px} .lc li:not(:last-child)::after{content:"→";margin:0 4px 0 8px;color:var(--muted)}
.back{margin:8px 0 0;font-size:12.5px;color:var(--green);font-weight:600}
.rules{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rules li{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--red);padding:10px 12px;border-radius:10px} .rules b{display:block;margin-bottom:3px} .rules span{font-size:13.5px;color:var(--muted)}
@media (max-width:1100px){.lanehead{display:none} .phase{grid-template-columns:1fr} .cl{display:block} .pl{flex-direction:row;flex-wrap:wrap;gap:4px 10px;align-items:baseline}}
/* GUIA */
table.t{border-collapse:collapse;width:100%;font-size:14px} table.t th{background:var(--forest);color:var(--on);text-align:left;padding:7px 9px;font-weight:600} table.t td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
.sec{margin-top:26px}
.sechead{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--forest);color:var(--on);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.copybox{width:100%;min-height:160px;margin-top:8px;font:12.5px var(--mono);background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:10px}
/* motion */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.ring{transition:--p .7s cubic-bezier(.2,.8,.2,1)}
.ring b{transition:transform .25s}
.ring.full b{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.bar>i{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.it{transition:background .2s,transform .15s}
.it:active{transform:scale(.995)}
.it input[type=checkbox]{transition:background .2s,border-color .2s,transform .15s}
.it input[type=checkbox]:active{transform:scale(.88)}
.it input[type=checkbox]:checked::after{animation:tick .28s cubic-bezier(.2,1.6,.4,1)}
.it .lb{background:linear-gradient(var(--green),var(--green)) no-repeat 0 58%/0% 1.5px;transition:background-size .35s ease,color .3s}
.it.done .lb{text-decoration:none;background-size:100% 1.5px;color:var(--muted)}
.it.pop{animation:rowflash .7s ease}
.group{transition:border-color .3s,box-shadow .3s}
.group .gdone{opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);font-size:11px;font-weight:700;color:var(--on);background:var(--green);padding:1px 8px;border-radius:99px}

  const rows=tops.map((tp,ti)=>{const id=`${mi}-${ti}`,v=state.topics[id]||0;if(tFilter&&v>=4)return"";return `<div class="trow"><span>${esc(tp)}</span><span class="lv" role="group" aria-label="Nível">${[1,2,3,4,5].map(n=>`<button data-act="lvl" data-t="${id}" data-v="${n}" aria-pressed="${v===n}">N${n}</button>`).join("")}</span></div>`}).join("");
  if(!rows)return"";
  return `<details class="day tmod" open><summary><span class="mono">${esc(code)}</span><span class="sum-t">${esc(name)} <span class="muted" style="font-weight:500">· ${esc(period)} · ${esc(prio)}</span></span><span class="mono" data-tavg="${mi}">média N${av.toFixed(1).replace(".",",")}</span></summary><div class="body">${rows}</div></details>`}).join("")}`;
}

function vFluxo(){

  const node=s=>{const [d,t,det,k,o]=s;const ch=["done","gate","mile","test"].includes(k)?`<span class="badge">${esc(F.kl[k])}</span>`:"";return `<li class="n k-${k}"><div class="nh"><span class="mono">${esc(d)}</span>${ch}</div><p class="tt">${esc(t)}</p>${det?`<p class="det">${esc(det)}</p>`:""}${o?`<div class="out">↳ ${esc(o)}</div>`:""}</li>`};
  return `<h2>Fluxograma da preparação</h2><p class="muted" style="max-width:75ch">Do planejamento à contratação. Cada coluna é uma frente; cada linha é uma fase no tempo. “↳” mostra o que uma etapa entrega para outra frente.</p>
  <section class="sec"><h3>O caminho em uma linha</h3><ol class="spine">${F.spine.map(([t,d,c])=>`<li class="sp ${c}"><b>${esc(t)}</b><span>${esc(d)}</span></li>`).join("")}</ol></section>
  <section class="sec"><h3>As frentes, fase a fase</h3><div class="lanehead"><div></div>${F.lanes.map(([k,n,w])=>`<div class="lh l-${k}"><b>${esc(n)}</b><span>${esc(w)}</span></div>`).join("")}</div>
  ${F.phases.map(([c,n,d,cells])=>`<div class="phase"><div class="pl"><span class="pc">${esc(c)}</span><b>${esc(n)}</b><span class="pd">${esc(d)}</span></div>${F.lanes.map(([k,ln])=>`<div class="cell l-${k}"><div class="cl">${esc(ln)}</div><ol class="chain">${(cells[k]||[]).map(node).join("")}</ol></div>`).join("")}</div>`).join("")}</section>
  <section class="sec"><h3>Ciclos que se repetem</h3><div class="loops">${F.loops.map(([n,t,w,st,b])=>`<article class="loop"><header><span class="ln">${n}</span><div><b>${esc(t)}</b><span>${esc(w)}</span></div></header><ol class="lc">${st.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><p class="back">↺ ${esc(b)}</p></article>`).join("")}</div></section>
  <section class="sec"><h3>Regras de interrupção</h3><ul class="rules">${F.rules.map(([q,a])=>`<li><b>${esc(q)}</b><span>${esc(a)}</span></li>`).join("")}</ul></section>`;
}

function refreshDay(iso,srcEl){
  const items=allItems(iso), c=dayState(iso).c||{}, done=items.filter(i=>c[i.id]).length, p=items.length?pct(done/items.length):0;
  document.querySelectorAll(`[data-ring="${iso}"]`).forEach(el=>{const was=el.classList.contains("full");el.style.setProperty("--p",p);el.classList.toggle("full",p===100);if(p===100&&!was)celebrate(el)});
  document.querySelectorAll(`[data-pct="${iso}"]`).forEach(el=>el.textContent=p+"%");
  document.querySelectorAll(`[data-count="${iso}"]`).forEach(el=>el.textContent=`${done} de ${items.length} itens`);
  document.querySelectorAll(`[data-bar="${iso}"]`).forEach(el=>el.style.width=p+"%");
  document.querySelectorAll(`[data-pctl="${iso}"]`).forEach(el=>el.textContent=p+"% feito");
  plan(iso).forEach(g=>{const full=g.items.length&&g.items.every(i=>c[i.id]);document.querySelectorAll(`[data-group="${iso}|${g.id}"]`).forEach(el=>{const was=el.classList.contains("complete");el.classList.toggle("complete",!!full);if(full&&!was&&srcEl&&!document.querySelector(`[data-ring="${iso}"]`))celebrate(el.querySelector(".gdone")||el)})});
  if(p===100&&srcEl&&!document.querySelector(`[data-ring="${iso}"]`))celebrate(srcEl);
}
function celebrate(el){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!el)return;
  const r=el.getBoundingClientRect(), b=document.createElement("div");b.className="burst";b.style.left=(r.left+r.width/2)+"px";b.style.top=(r.top+r.height/2)+"px";
  const cols=["var(--emerald)","var(--green)","var(--lime)","var(--teal)","var(--gold)"];
  for(let i=0;i<28;i++){const s=document.createElement("i");const ang=Math.random()*Math.PI*2,dist=50+Math.random()*90;s.style.setProperty("--x",Math.cos(ang)*dist+"px");s.style.setProperty("--y",(Math.sin(ang)*dist-30)+"px");s.style.setProperty("--r",(Math.random()*540-270)+"deg");s.style.setProperty("--c",cols[i%cols.length]);s.style.animationDelay=(Math.random()*.08)+"s";b.appendChild(s)}
  document.body.appendChild(b);setTimeout(()=>b.remove(),1300);
}
function updateNow(){
  const now=new Date(), mins=now.getHours()*60+now.getMinutes(), t=todayISO();
  document.querySelectorAll("[data-group]").forEach(el=>{const [d]=el.dataset.group.split("|");const f=el.dataset.from,to=el.dataset.to;const on=view==="hoje"&&d===t&&f!==""&&mins>=+f&&mins<+to;el.classList.toggle("now",on);const slot=el.querySelector(".nowslot");if(slot)slot.innerHTML=on?'<span class="nowtag">agora</span>':""});
}
function animate(cls){const app=document.getElementById("app");app.classList.remove("view-in","slide-l","slide-r");void app.offsetWidth;app.classList.add(cls)}
const VIEWS={hoje:vHoje,semana:vSemana,calendario:vCal,progresso:vProg,topicos:vTopicos,fluxo:vFluxo,guia:vGuia};
let view="hoje";
function render(){
  const app=document.getElementById("app");
  const active=document.activeElement, aid=active&&active.id, sel=active&&active.selectionStart;
  app.innerHTML=VIEWS[view]();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.view===view?"page":"false"));
  if(aid){const el=document.getElementById(aid);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}
}
function go(v,keepDate){view=VIEWS[v]?v:"hoje";if(!keepDate&&v!=="hoje"&&v!=="semana")viewDate=null;try{if(location.hash!=="#"+view)history.replaceState(null,"","#"+view)}catch(e){location.hash=view}render();animate("view-in");window.scrollTo({top:0,behavior:"smooth"})}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("on"),1800)}

/* ---------- summary & backup ---------- */
function weekSummary(){
  const ds=weekDates(viewDate||todayISO()), w=week(ds[0]>=PLAN_START?ds[0]:ds[4]);
  let s=`RESUMO DO PAINEL — Semana ${w} (${fmt(ds[0])} a ${fmt(ds[6])})\nObjetivo: ${DATA.wgoal[w]||"-"}\n\n`;
  ds.forEach(d=>{const k=kind(d),L=lesson(d),st=dayState(d);if(k==="study"){s+=`${WDS[wd(d)]} ${fmt(d)} · ${L.title} · ${pct(completion(d))}% do checklist`;if(st.nota!==undefined&&st.nota!=="")s+=` · nota ${st.nota}%`;if(st.horas)s+=` · ${st.horas}h`;if(st.energia)s+=` · energia ${st.energia}/5`;s+="\n";const c=st.c||{};const miss=allItems(d).filter(i=>!c[i.id]).map(i=>i.lb);if(miss.length&&d<=todayISO())s+=`   Não feito: ${miss.join("; ")}\n`;if(st.notas)s+=`   Anotações: ${st.notas.replace(/\n/g," / ")}\n`}});
  const low=[];DATA.mods.forEach((m,mi)=>m[4].forEach((tp,ti)=>{const v=state.topics[`${mi}-${ti}`];if(v&&v<4)low.push(`${tp} (N${v})`)}));
  if(low.length)s+=`\nTópicos abaixo de N4: ${low.slice(0,15).join("; ")}\n`;
  s+=`\nAtraso no cronograma: ${state.settings.offset||0} dia(s)\n`;
  return s;
}
function copyText(text,boxId){
  const show=()=>{const box=document.getElementById(boxId);if(box){box.innerHTML=`<textarea class="copybox" readonly>${esc(text)}</textarea>`;const ta=box.querySelector("textarea");ta.focus();ta.select()}};
  try{navigator.clipboard.writeText(text).then(()=>toast("Copiado"),()=>{show();toast("Selecione e copie o texto")})}catch(e){show()}
}

/* ---------- events ---------- */
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches('input[type=checkbox][data-item]')){const ds=dayState(t.dataset.day);ds.c=ds.c||{};if(t.checked)ds.c[t.dataset.item]=1;else delete ds.c[t.dataset.item];saveDay(t.dataset.day);const li=t.closest(".it");if(li){li.classList.toggle("done",t.checked);if(t.checked){li.classList.remove("pop");void li.offsetWidth;li.classList.add("pop")}}refreshDay(t.dataset.day,t);if(t.checked)toast("Feito ✓")}
  if(t.matches('[data-act="calfilter"]')){calFilter=t.value;render()}
});
const inTimers={};
document.addEventListener("input",e=>{
  const t=e.target;if(!t.dataset.field)return;const ds=dayState(t.dataset.day);
  ds[t.dataset.field]=t.type==="number"?(t.value===""?"":Number(t.value)):t.value;
  saveDay(t.dataset.day);
});
document.addEventListener("click",e=>{
  const tab=e.target.closest(".tab");if(tab){go(tab.dataset.view);return}
  const gt=e.target.closest("[data-goto]");if(gt){viewDate=gt.dataset.goto;go("hoje",true);return}
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT")return;
  const a=b.dataset.act, base=viewDate||todayISO(), sy=window.scrollY;
  if(a==="prev"){viewDate=add(base,-1);render();animate("slide-l")}
  else if(a==="next"){viewDate=add(base,1);render();animate("slide-r")}
  else if(a==="today"){const back=base>todayISO();viewDate=null;render();animate(back?"slide-l":"slide-r")}
  else if(a==="wprev"){viewDate=add(base,-7);render();animate("slide-l")}
  else if(a==="wnext"){viewDate=add(base,7);render();animate("slide-r")}
  else if(a==="checkall"||a==="clearall"){const ds=dayState(base);ds.c=ds.c||{};allItems(base).forEach(i=>{if(a==="checkall")ds.c[i.id]=1;else delete ds.c[i.id]});saveDay(base);document.querySelectorAll(`input[type=checkbox][data-day="${base}"]`).forEach((cb,i)=>{cb.checked=a==="checkall";const li=cb.closest(".it");if(li){li.classList.toggle("done",cb.checked);if(cb.checked){setTimeout(()=>{li.classList.remove("pop");void li.offsetWidth;li.classList.add("pop")},i*25)}}});refreshDay(base,b)}
  else if(a==="energia"){const ds=dayState(b.dataset.day);ds.energia=Number(b.dataset.v);saveDay(b.dataset.day);b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))}
  else if(a==="expand"){calOpen=!calOpen;document.querySelectorAll("details.day").forEach(d=>d.open=calOpen);b.textContent=calOpen?"Recolher tudo":"Abrir tudo"}
  else if(a==="gotoday"){const el=document.getElementById("d-"+todayISO());if(el){el.open=true;el.scrollIntoView({block:"start"})}else toast("Hoje está fora do cronograma")}
  else if(a==="lvl"){const id=b.dataset.t,v=Number(b.dataset.v);state.topics[id]=state.topics[id]===v?0:v;saveTopics();b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(Number(x.dataset.v)===state.topics[id])));const mi=id.split("-")[0],tops=DATA.mods[mi][4];const av=tops.reduce((s,_,ti)=>s+(state.topics[mi+"-"+ti]||0),0)/tops.length;const el=document.querySelector(`[data-tavg="${mi}"]`);if(el)el.textContent="média N"+av.toFixed(1).replace(".",",")}
  else if(a==="tfilter"){tFilter=!tFilter;render()}
  else if(a==="off+"||a==="off-"){state.settings.offset=Math.max(0,(state.settings.offset||0)+(a==="off+"?1:-1));saveSettings();render();window.scrollTo(0,sy);toast("Cronograma ajustado")}
  else if(a==="copyweek"){const box=document.getElementById("bk")||null;copyText(weekSummary(),"bk")}
  else if(a==="backup"){copyText(JSON.stringify(state),"bk")}
  else if(a==="restore"){const box=document.getElementById("bk");box.innerHTML=`<textarea class="copybox" id="rst" placeholder="Cole aqui o backup copiado antes"></textarea><button class="btn primary" data-act="dorestore" style="margin-top:8px">Restaurar agora</button>`}
  else if(a==="dorestore"){try{const s=JSON.parse(document.getElementById("rst").value);if(!s||typeof s!=="object"||!s.days)throw 0;state={days:s.days,topics:s.topics||{},settings:Object.assign({offset:0},s.settings||{})};Object.keys(state.days).forEach(d=>saveDay(d));saveTopics();saveSettings();render();toast("Backup restaurado")}catch(err){toast("Backup inválido")}}
});
document.addEventListener("keydown",e=>{if(view!=="hoje"||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;if(e.key==="ArrowLeft"){viewDate=add(viewDate||todayISO(),-1);render()}if(e.key==="ArrowRight"){viewDate=add(viewDate||todayISO(),1);render()}});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==view)go(h)});
function tick(){const n=new Date();document.getElementById("clock").textContent=`${WDS[(n.getDay()+6)%7]} ${fmt(ISO(n))} · ${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`}
setInterval(()=>{tick();updateNow()},30000);
tick();
const h0=location.hash.slice(1);view=VIEWS[h0]?h0:"hoje";
render();animate("view-in");
initDb();
